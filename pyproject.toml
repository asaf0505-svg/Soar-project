[project]
name = "soc_case_manager"
version = "0.1.0"
description = "SOC Case Manager for advanced python course"
requires-python = ">=3.9"
authors = [
    {name = "Gal"}
]

dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["soc_case_manager"]
