name: Stage 2 validation

on:
  push:
    branches:
      - "stage2/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run all existing and new tests offline
        run: python -m pytest -q
      - name: Check source syntax
        run: python -m compileall -q main.py soc_case_manager tests
